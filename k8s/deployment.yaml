apiVersion: apps/v1
kind: Deployment
metadata:
  name: grammar-corrector
  labels:
    app: grammar-corrector
spec:
  replicas: 1
  selector:
    matchLabels:
      app: grammar-corrector
  template:
    metadata:
      labels:
        app: grammar-corrector
    spec:
      containers:
        - name: grammar-corrector
          image: grammar-corrector:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8000
          resources:
            requests:
              cpu: "500m"
              memory: "2Gi"
            limits:
              cpu: "2"
              memory: "4Gi"
          readinessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 20
            periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: grammar-corrector
spec:
  type: NodePort
  selector:
    app: grammar-corrector
  ports:
    - port: 8000
      targetPort: 8000
      nodePort: 30080
